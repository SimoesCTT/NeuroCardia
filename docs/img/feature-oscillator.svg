<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="oscTitle oscDesc">
  <title id="oscTitle">Kuramoto network on the phase circle</title>
  <desc id="oscDesc">Sixteen coupled oscillators arranged around a unit circle. Coupling lines link every oscillator to the heart oscillator at phase zero. A radial arrow shows the order parameter r pointing toward the mean phase.</desc>

  <!-- Background -->
  <rect width="480" height="360" fill="#0B1B2E"/>

  <!-- Faint grid -->
  <g stroke="#142A44" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="480" y2="90"/>
    <line x1="0" y1="180" x2="480" y2="180"/>
    <line x1="0" y1="270" x2="480" y2="270"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
  </g>

  <!-- Center of the phase circle -->
  <g transform="translate(240 180)">

    <!-- Unit circle -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#1C3A5C" stroke-width="1.5"/>

    <!-- Radial spokes at 22.5-degree intervals (faint) -->
    <g stroke="#1C3A5C" stroke-width="1" opacity="0.4">
      <line x1="0" y1="0" x2="130" y2="0"/>
      <line x1="0" y1="0" x2="120" y2="50"/>
      <line x1="0" y1="0" x2="92" y2="92"/>
      <line x1="0" y1="0" x2="50" y2="120"/>
      <line x1="0" y1="0" x2="0" y2="130"/>
      <line x1="0" y1="0" x2="-50" y2="120"/>
      <line x1="0" y1="0" x2="-92" y2="92"/>
      <line x1="0" y1="0" x2="-120" y2="50"/>
      <line x1="0" y1="0" x2="-130" y2="0"/>
      <line x1="0" y1="0" x2="-120" y2="-50"/>
      <line x1="0" y1="0" x2="-92" y2="-92"/>
      <line x1="0" y1="0" x2="-50" y2="-120"/>
      <line x1="0" y1="0" x2="0" y2="-130"/>
      <line x1="0" y1="0" x2="50" y2="-120"/>
      <line x1="0" y1="0" x2="92" y2="-92"/>
      <line x1="0" y1="0" x2="120" y2="-50"/>
    </g>

    <!-- Coupling lines from heart oscillator to the rest (all-to-all, drawn faint) -->
    <g stroke="#4DD9E8" stroke-width="0.8" opacity="0.18">
      <line x1="130" y1="0" x2="120" y2="50"/>
      <line x1="130" y1="0" x2="92" y2="92"/>
      <line x1="130" y1="0" x2="50" y2="120"/>
      <line x1="130" y1="0" x2="0" y2="130"/>
      <line x1="130" y1="0" x2="-50" y2="120"/>
      <line x1="130" y1="0" x2="-92" y2="92"/>
      <line x1="130" y1="0" x2="-130" y2="0"/>
      <line x1="130" y1="0" x2="-92" y2="-92"/>
      <line x1="130" y1="0" x2="0" y2="-130"/>
      <line x1="130" y1="0" x2="92" y2="-92"/>
    </g>

    <!-- Oscillators (16 small circles, slight jitter around perfect spacing) -->
    <g fill="#8FA3B8">
      <circle cx="130.0" cy="0.0"   r="4"/>
      <circle cx="120.1" cy="49.8"  r="4"/>
      <circle cx="91.9"  cy="91.9"  r="4"/>
      <circle cx="49.8"  cy="120.1" r="4"/>
      <circle cx="0.0"   cy="130.0" r="4"/>
      <circle cx="-49.8" cy="120.1" r="4"/>
      <circle cx="-91.9" cy="91.9"  r="4"/>
      <circle cx="-120.1" cy="49.8" r="4"/>
      <circle cx="-130.0" cy="0.0"  r="4"/>
      <circle cx="-120.1" cy="-49.8" r="4"/>
      <circle cx="-91.9" cy="-91.9" r="4"/>
      <circle cx="-49.8" cy="-120.1" r="4"/>
      <circle cx="0.0"   cy="-130.0" r="4"/>
      <circle cx="49.8"  cy="-120.1" r="4"/>
      <circle cx="91.9"  cy="-91.9"  r="4"/>
      <circle cx="120.1" cy="-49.8"  r="4"/>
    </g>

    <!-- Heart oscillator highlighted (larger, cyan glow) -->
    <circle cx="130" cy="0" r="10" fill="#4DD9E8" opacity="0.35"/>
    <circle cx="130" cy="0" r="6" fill="#4DD9E8"/>
    <text x="148" y="6" font-family="ui-monospace, monospace" font-size="11" fill="#4DD9E8">heart osc</text>

    <!-- Order parameter vector: from center toward mean phase (slightly above horizontal) -->
    <line x1="0" y1="0" x2="102" y2="-12" stroke="#F0F6FA" stroke-width="2"/>
    <polygon points="102,-12 96,-18 96,-6" fill="#F0F6FA"/>
    <text x="60" y="-18" font-family="ui-monospace, monospace" font-size="14" fill="#F0F6FA" font-weight="600">r(t)</text>

    <!-- Origin dot -->
    <circle cx="0" cy="0" r="3" fill="#F0F6FA"/>
  </g>

  <!-- Caption below -->
  <text x="240" y="340" text-anchor="middle"
        font-family="ui-monospace, monospace" font-size="12" fill="#8FA3B8">
    N = 16 coupled oscillators, all-to-all coupling, r(t) = order parameter
  </text>
</svg>
