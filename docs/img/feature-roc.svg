<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="rocTitle rocDesc">
  <title id="rocTitle">ROC curve of the Kuramoto residual</title>
  <desc id="rocDesc">ROC curve for classifying normal sinus rhythm versus atrial fibrillation using the Kuramoto residual. Area under the curve is 0.89 on the pilot corpus of eighteen recordings.</desc>

  <!-- Background -->
  <rect width="480" height="360" fill="#0B1B2E"/>

  <!-- Plot area -->
  <g transform="translate(60 40)">
    <!-- Plot rectangle: 340 wide, 260 tall -->
    <rect x="0" y="0" width="340" height="260" fill="#0A1522" stroke="#1C3A5C" stroke-width="1"/>

    <!-- Gridlines -->
    <g stroke="#142A44" stroke-width="1" opacity="0.7">
      <line x1="85"  y1="0" x2="85"  y2="260"/>
      <line x1="170" y1="0" x2="170" y2="260"/>
      <line x1="255" y1="0" x2="255" y2="260"/>
      <line x1="0" y1="65"  x2="340" y2="65"/>
      <line x1="0" y1="130" x2="340" y2="130"/>
      <line x1="0" y1="195" x2="340" y2="195"/>
    </g>

    <!-- Diagonal reference (chance line) -->
    <line x1="0" y1="260" x2="340" y2="0"
          stroke="#8FA3B8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Shaded area under the ROC curve -->
    <path d="M 0 260
             L 20 100
             L 50 55
             L 100 25
             L 170 8
             L 250 2
             L 340 0
             L 340 260 Z"
          fill="#4DD9E8" fill-opacity="0.12"/>

    <!-- ROC curve -->
    <path d="M 0 260
             L 20 100
             L 50 55
             L 100 25
             L 170 8
             L 250 2
             L 340 0"
          fill="none" stroke="#4DD9E8" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- AUC annotation -->
    <text x="200" y="140"
          font-family="ui-monospace, monospace" font-size="20"
          fill="#4DD9E8" font-weight="600">AUC = 0.89</text>
    <text x="200" y="162"
          font-family="ui-monospace, monospace" font-size="11"
          fill="#8FA3B8">pilot corpus, n = 18</text>

    <!-- Axis labels -->
    <text x="170" y="290" text-anchor="middle"
          font-family="ui-monospace, monospace" font-size="11" fill="#8FA3B8">
      false positive rate
    </text>
    <text x="-130" y="-35" text-anchor="middle" transform="rotate(-90)"
          font-family="ui-monospace, monospace" font-size="11" fill="#8FA3B8">
      true positive rate
    </text>

    <!-- Axis ticks -->
    <text x="0" y="275" font-family="ui-monospace, monospace" font-size="9" fill="#8FA3B8">0</text>
    <text x="340" y="275" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#8FA3B8">1</text>
    <text x="-8" y="263" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#8FA3B8">0</text>
    <text x="-8" y="6"   text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#8FA3B8">1</text>
  </g>

  <!-- Caption -->
  <text x="240" y="340" text-anchor="middle"
        font-family="ui-monospace, monospace" font-size="12" fill="#8FA3B8">
    Kuramoto residual: sinus vs. atrial fibrillation
  </text>
</svg>
